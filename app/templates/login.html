{% extends "base.html" %}
{% block title %}Iniciar Sesión | NutriTrack Pro{% endblock %}

{% block section %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card shadow-lg">
      <div class="card-header bg-white border-0 text-center py-4">
        <h3 class="mb-0">
          <i class="fas fa-sign-in-alt text-primary me-2"></i>Iniciar Sesión
        </h3>
      </div>
      <div class="card-body px-5 py-4">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-4">
            <label for="username" class="form-label fw-medium">Usuario</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-user"></i>
              </span>
              <input 
                type="text" 
                class="form-control ps-3" 
                id="username" 
                name="username" 
                placeholder="tu.usuario" 
                required
              >
            </div>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-lock"></i>
              </span>
              <input 
                type="password" 
                class="form-control ps-3" 
                id="password" 
                name="password" 
                placeholder="••••••••" 
                required
              >
            </div>
          </div>
          
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary py-2 fw-medium">
              <i class="fas fa-arrow-right-to-bracket me-2"></i>Acceder
            </button>
          </div>
        </form>

        <div class="text-center my-3">
          <span>— o —</span>
        </div>

        <a href="{{ url_for('login_google') }}" class="btn btn-danger py-2 fw-medium">
          <i class="fab fa-google me-2"></i> Iniciar sesión con Google
        </a>
        

        <div class="text-center small mt-4">
          ¿No tienes cuenta? 
          <a href="{{ url_for('register') }}" class="text-primary fw-medium">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
