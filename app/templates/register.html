{% extends "base.html" %}
{% block title %}Registro | NutriTrack Pro{% endblock %}

{% block section %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card shadow-lg">
      <div class="card-header bg-white border-0 text-center py-4">
        <h3 class="mb-0">
          <i class="fas fa-user-plus text-primary me-2"></i>Crear Cuenta
        </h3>
      </div>
      <div class="card-body px-5 py-4">
        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-4">
            <label for="username" class="form-label fw-medium">Usuario</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="fas fa-at"></i>
              </span>
              <input 
                type="text" 
                class="form-control" 
                id="username" 
                name="username" 
                placeholder="ej: usuario123" 
                required
                minlength="3"
                maxlength="30"
              >
            </div>
            <small class="text-muted">Entre 3 y 30 caracteres</small>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="fas fa-key"></i>
              </span>
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                name="password" 
                placeholder="••••••••" 
                required
                minlength="6"
              >
            </div>
            <small class="text-muted">Mínimo 6 caracteres</small>
          </div>
          
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary py-2 fw-medium">
              <i class="fas fa-user-check me-2"></i>Registrarse
            </button>
          </div>
          
          <div class="text-center small mt-4">
            ¿Ya tienes cuenta? 
            <a href="{{ url_for('login') }}" class="text-primary fw-medium">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
