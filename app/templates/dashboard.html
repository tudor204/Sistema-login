{% extends "base.html" %}
{% block section %}
<section>
  <h2>👋 Bienvenido, {{ username }}</h2>
  <p>Desde aquí puedes buscar alimentos y ver su información nutricional.</p>
  <hr>
  <h3>🔍 Buscar alimento</h3>
  <form method="GET" action="{{ url_for('search_food') }}">
    <label for="query">Nombre del alimento</label>
    <input type="text" name="query" id="query" placeholder="Ej. pollo, manzana..." required>
    <button type="submit">Buscar</button>
  </form>
</section>
{% endblock %}
