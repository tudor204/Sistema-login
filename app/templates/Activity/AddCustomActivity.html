{% extends "base.html" %}

{% block title %}Añadir Actividad | NutriTrack Pro{% endblock %}

{% block section %}
<div class="page-header mb-4">
  <h1 class="page-title">
    <i class="fas fa-plus-circle me-2"></i> Añadir Actividad
  </h1>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Nombre de la actividad</label>
        <input type="text" class="form-control" name="activity_name" required>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" class="form-control" name="date_recorded"
                 value="{{ datetime.utcnow().strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Duración (minutos)</label>
          <input type="number" class="form-control" name="duration_minutes" min="1" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Calorías quemadas</label>
          <input type="number" class="form-control" name="calories_burned" min="1" required>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-check me-1"></i> Guardar
        </button>
        <a href="{{ url_for('activity') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
