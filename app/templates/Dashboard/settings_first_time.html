{% extends "base.html" %}
{% block title %}Configuración Inicial | NutriTrack Pro{% endblock %}

{% block section %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="fs-3 fw-bold text-primary">
    <i class="fas fa-user-cog me-3"></i>Configuración Inicial del Perfil
  </h1>
</div>

<div class="card shadow-sm border-0 rounded-5 p-4">
  <form method="POST" novalidate>
    <div class="row g-4">

      <!-- Edad -->
      <div class="col-12 col-md-6 col-lg-4">
        <label for="age" class="form-label fw-semibold text-secondary">
          <i class="fas fa-hourglass-half me-2 text-warning"></i>Edad (años)
        </label>
        <input
          type="number"
          id="age"
          name="age"
          class="form-control form-control-lg rounded-4 border-2 border-warning"
          placeholder="30"
          min="10"
          max="100"
          required
          value="{{ goals.age or '' }}"
        >
      </div>

      <!-- Peso -->
      <div class="col-12 col-md-6 col-lg-4">
        <label for="weight" class="form-label fw-semibold text-secondary">
          <i class="fas fa-weight me-2 text-danger"></i>Peso (kg)
        </label>
        <input
          type="number"
          id="weight"
          name="weight"
          class="form-control form-control-lg rounded-4 border-2 border-danger"
          placeholder="78"
          step="0.1"
          min="30"
          max="200"
          required
          value="{{ goals.weight or '' }}"
        >
      </div>

      <!-- Altura -->
      <div class="col-12 col-md-6 col-lg-4">
        <label for="height" class="form-label fw-semibold text-secondary">
          <i class="fas fa-ruler-vertical me-2 text-info"></i>Altura (cm)
        </label>
        <input
          type="number"
          id="height"
          name="height"
          class="form-control form-control-lg rounded-4 border-2 border-info"
          placeholder="177"
          min="100"
          max="250"
          required
          value="{{ goals.height or '' }}"
        >
      </div>

      <!-- Sexo -->
      <div class="col-12 col-md-6 col-lg-4">
        <label for="gender" class="form-label fw-semibold text-secondary">
          <i class="fas fa-venus-mars me-2 text-primary"></i>Sexo
        </label>
        <select
          id="gender"
          name="gender"
          class="form-select form-select-lg rounded-4 border-2 border-primary"
          required
        >
          <option value="" disabled {% if not goals.gender %}selected{% endif %}>Selecciona</option>
          <option value="male" {% if goals.gender == 'male' %}selected{% endif %}>Hombre</option>
          <option value="female" {% if goals.gender == 'female' %}selected{% endif %}>Mujer</option>
        </select>
      </div>

      <!-- Nivel de Actividad -->
      <div class="col-12 col-md-6 col-lg-4">
        <label for="activity_level" class="form-label fw-semibold text-secondary">
          <i class="fas fa-running me-2 text-success"></i>Nivel de Actividad
        </label>
        <select
          id="activity_level"
          name="activity_level"
          class="form-select form-select-lg rounded-4 border-2 border-success"
          required
        >
          <option value="" disabled {% if not goals.daily_activity %}selected{% endif %}>Selecciona</option>
          <option value="sedentary" {% if goals.daily_activity == 0 %}selected{% endif %}>Sedentario (poco o nada de ejercicio)</option>
          <option value="light" {% if goals.daily_activity == 30 %}selected{% endif %}>Ligero (1-3 días por semana)</option>
          <option value="moderate" {% if goals.daily_activity == 60 %}selected{% endif %}>Moderado (3-5 días por semana)</option>
          <option value="active" {% if goals.daily_activity == 90 %}selected{% endif %}>Activo (6-7 días por semana)</option>
          <option value="very_active" {% if goals.daily_activity == 120 %}selected{% endif %}>Muy activo (entrenamientos intensos)</option>
        </select>
      </div>

      <!-- Objetivo -->
      <div class="col-12 col-md-6 col-lg-4">
        <label for="goal" class="form-label fw-semibold text-secondary">
          <i class="fas fa-bullseye me-2 text-dark"></i>Objetivo
        </label>
        <select
          id="goal"
          name="goal"
          class="form-select form-select-lg rounded-4 border-2 border-dark"
          required
        >
          <option value="" disabled {% if not goals.goal %}selected{% endif %}>Selecciona</option>
          <option value="gain" {% if goals.goal == 'gain' %}selected{% endif %}>Ganar masa muscular</option>
          <option value="lose" {% if goals.goal == 'lose' %}selected{% endif %}>Perder grasa</option>
          <option value="maintain" {% if goals.goal == 'maintain' %}selected{% endif %}>Mantener peso</option>
        </select>
      </div>

    </div>

    <div class="mt-5 text-end">
      <button type="submit" class="btn btn-primary btn-lg rounded-5 px-5 shadow-sm">
        <i class="fas fa-check-circle me-2"></i>Guardar y Calcular Metas
      </button>
    </div>
  </form>
</div>

<style>
  input.form-control-lg, select.form-select-lg {
    transition: border-color 0.3s ease;
  }
  input.form-control-lg:focus, select.form-select-lg:focus {
    box-shadow: 0 0 8px rgba(0,123,255,0.25);
    border-color: #0d6efd !important;
  }
</style>
{% endblock %}
