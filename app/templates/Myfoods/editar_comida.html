{% extends "base.html" %}
{% block title %}Editar comida | NutriTrack Pro{% endblock %}

{% block section %}
<div class="page-header mb-4">
  <h1 class="page-title">
    <i class="fas fa-edit me-2"></i>Editar comida
  </h1>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="POST" action="{{ url_for('editar_comida_route', comida_id=comida['id']) }}">
      <div class="mb-3">
        <label class="form-label">Alimento</label>
        <input type="text" name="food_name" class="form-control" value="{{ comida['food_name'] }}" required>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Calorías (kcal)</label>
          <input type="number" name="calories" class="form-control" step="0.1" min="0" value="{{ comida['calories'] }}" required>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Proteínas (g)</label>
          <input type="number" name="proteins" class="form-control" step="0.1" min="0" value="{{ comida['proteins'] }}" required>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" name="date" class="form-control" value="{{ comida['date_iso'] }}" required>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">
          <i class="fas fa-check me-1"></i> Guardar
        </button>
        <a href="{{ url_for('mis_comidas') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
